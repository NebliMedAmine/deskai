# Phase 2: database only. The api + web services are added in Phase 5.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deskai
      POSTGRES_PASSWORD: deskai
      POSTGRES_DB: deskai
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deskai -d deskai']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
